name: SIDEWORLD Group SQL Disposable CI

on:
  pull_request:
    branches: [main]
    paths:
      - docs/architecture/SIDEWORLD_GROUP_RUNTIME_V1_SQL_PROPOSAL.sql
      - supabase/tests/verify-sideworld-group-runtime-proposal.sql
      - supabase/tests/verify-sideworld-group-runtime-concurrency.sh
      - 'supabase/migrations/*_sideworld_group_runtime_v1.sql'
      - .github/workflows/group-runtime-sql-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group-sql-disposable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  group-sql-disposable:
    name: Parse and test Group SQL (never production)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start disposable local Supabase
        run: supabase start

      - name: Full baseline migration replay with no fixtures
        run: supabase db reset --local --no-seed

      - name: Verify CLI migration matches reviewed SQL and run rollback-only tests
        shell: bash
        run: |
          set -euo pipefail
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          migration='supabase/migrations/20261024040523_sideworld_group_runtime_v1.sql'
          test -f "$migration"
          # The immutable proposal is the reviewed source of truth. Compare
          # executable SQL from the first DDL statement, excluding commentary.
          diff -u \
            <(sed -n '/^create table player.group_sessions (/,$p' \
              docs/architecture/SIDEWORLD_GROUP_RUNTIME_V1_SQL_PROPOSAL.sql |
              sed '/^-- Manual safety checklist/,$d' | sed '/^[[:space:]]*$/d') \
            <(sed -n '/^create table player.group_sessions (/,$p' "$migration" |
              sed '/^[[:space:]]*$/d')
          {
            printf 'BEGIN;\n'
            cat supabase/tests/verify-sideworld-group-runtime-proposal.sql
            printf '\nROLLBACK;\n'
          } | docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres
          result=$(docker exec "$db_container" psql -X -qAt -v ON_ERROR_STOP=1 \
            -U postgres -d postgres \
            -c "select to_regclass('player.group_sessions') is not null and to_regclass('player.quest_runs') is not null")
          test "$result" = 't'
          echo 'PASS: committed migration replays, authorizations verified and synthetic fixture rolled back.'

      - name: Test real concurrent Group SQL sessions in disposable Postgres
        shell: bash
        run: bash supabase/tests/verify-sideworld-group-runtime-concurrency.sh

      - name: Destroy disposable stack
        if: always()
        run: supabase stop --no-backup
