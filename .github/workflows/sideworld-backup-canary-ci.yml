name: SIDEWORLD Backup Canary Disposable CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production/backup-production.ps1'
      - 'scripts/production/verify-production-backup.ps1'
      - 'scripts/production/sideworld-group-canaries.sql'
      - 'docs/architecture/SIDEWORLD_DB_RECOVERY_FREE_PLAN_RUNBOOK.md'
      - '.github/workflows/sideworld-backup-canary-ci.yml'

permissions:
  contents: read

concurrency:
  group: backup-canary-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-canaries:
    name: Validate recovery canaries (disposable local DB only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Parse backup PowerShell scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/production/backup-production.ps1','scripts/production/verify-production-backup.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed for $file" }
          }
          Write-Host 'PASS: backup scripts parsed without any credential or DB access.'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start disposable local Supabase and replay existing migrations
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Execute read-only recovery inventory against disposable Postgres
        shell: bash
        run: |
          set -euo pipefail
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec "$db_container" mkdir -p /out
          docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < scripts/production/sideworld-group-canaries.sql
          mkdir -p /tmp/sideworld-backup-canary-ci
          docker cp "$db_container:/out/." /tmp/sideworld-backup-canary-ci/
          for file in sideworld-counts.csv sideworld-release-canaries.csv \
            sideworld-rls.csv sideworld-group-objects.csv sideworld-extensions.csv; do
            test -s "/tmp/sideworld-backup-canary-ci/$file"
          done
          grep -q 'canon.quest_releases' /tmp/sideworld-backup-canary-ci/sideworld-counts.csv
          grep -q 'player.quest_runs' /tmp/sideworld-backup-canary-ci/sideworld-rls.csv
          grep -q 'migration.20261024040523' /tmp/sideworld-backup-canary-ci/sideworld-group-objects.csv
          echo 'PASS: canonical/release/RLS/Group/extension canaries exported, no private data emitted.'
          # Never upload canary CSVs as GitHub artifacts. No live credentials.

      - name: Destroy disposable database and canaries
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -rf /tmp/sideworld-backup-canary-ci
