name: Database CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start disposable local Supabase
        run: supabase start
      - name: Replay repository migrations and seed locally
        run: supabase db reset --local
      - name: Verify SQL scripts against local Postgres
        shell: bash
        run: |
          set -euo pipefail
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container" || { echo 'Local Supabase database container not found'; exit 1; }
          for script in supabase/tests/verify-schema.sql supabase/tests/verify-workflow-security.sql supabase/tests/verify-sideworld-bases.sql; do
            echo "Running $script"
            docker exec -i "$db_container" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < "$script"
          done
      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup
