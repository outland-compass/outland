name: Studio CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sideworld-studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ci
  cancel-in-progress: true
jobs:
  studio-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:studio
      - run: npm run test:studio
      - run: npm run build:studio
